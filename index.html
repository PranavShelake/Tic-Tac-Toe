<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Two Player Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="turn-indicator">
            Current Turn: <span class="current-player">X</span>
        </div>
        <div class="game-message"></div>
        
        <div class="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="scoreboard">
            <div class="score-card">
                <div class="score-label">Player X Wins</div>
                <div class="score-value" id="x-wins">0</div>
            </div>
            <div class="score-card draw">
                <div class="score-label">Draws</div>
                <div class="score-value" id="draws">0</div>
            </div>
            <div class="score-card">
                <div class="score-label">Player O Wins</div>
                <div class="score-value" id="o-wins">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="reset-btn" onclick="resetGame()">New Game</button>
            <button class="clear-stats-btn" onclick="clearStats()">Clear Stats</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
